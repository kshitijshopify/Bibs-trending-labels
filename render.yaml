# Render Blueprint for the LIVE app "Bibs Trending Labels" (BIBS B2B DIST).
#
# - One web service with a persistent disk: sessions and run logs live in a
#   SQLite file on the disk (paid instance required; no separate database).
#   With a disk, Render stops the old instance before starting the new one,
#   so a deploy means a short downtime.
# - One cron job that only calls the app's protected endpoint. It runs at
#   00:00 and 01:00 UTC; the app picks the call that is 02:00 Copenhagen.
#   Do not deploy the web service around 00:00-01:30 UTC.
# - The region cannot be changed after the services are created.
#
# Store changes need ALL of: Settings -> "Store updates" switched on in the app
# (off by default), BESTSELLER_APPLY_ENABLED=true, the shop listed in
# BESTSELLER_APPLY_ALLOWED_SHOPS, and write_products granted. The in-app switch
# is the day-to-day on/off control; it needs no deploy.
#
# Values marked `sync: false` are asked for when the Blueprint is created and
# are never overwritten by a Blueprint sync. Values with `value:` are reset to
# the value below on every sync, so change them here, not in the dashboard.
services:
  - type: web
    name: bibs-trending-labels
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run setup && npm run start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/prod.sqlite
      # Must be identical to [access_scopes] scopes in shopify.app.toml.
      - key: SCOPES
        value: read_products,read_reports,write_products
      # Client ID / secret of the "Bibs Trending Labels" app (Dev Dashboard).
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # e.g. https://bibs-trending-labels.onrender.com (no trailing slash);
      # must match application_url in shopify.app.toml.
      - key: SHOPIFY_APP_URL
        sync: false
      - key: BESTSELLER_LABEL_TAG
        value: label:Trending
      # The BIBS myshopify domain, e.g. <bibs-store>.myshopify.com
      - key: BESTSELLER_APPLY_ALLOWED_SHOPS
        sync: false
      - key: BESTSELLER_CRON_SHOPS
        sync: false
      # Random secrets generated by Render. The cron job copies the cron
      # secret from this service, so the two always match.
      - key: BESTSELLER_APPROVAL_SECRET
        generateValue: true
      - key: BESTSELLER_CRON_SECRET
        generateValue: true
      # Emails only go out once Flow workflows on these triggers are turned on.
      - key: BESTSELLER_FLOW_TRIGGER_ENABLED
        value: "true"
      # Server permission for store changes. Nothing changes until the in-app
      # "Store updates" switch is on (off by default).
      - key: BESTSELLER_APPLY_ENABLED
        value: "true"

  - type: cron
    name: bibs-trending-labels-nightly
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 0,1 * * *"
    buildCommand: "true"
    startCommand: node scripts/trigger-nightly.mjs
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Public URL of the web service, e.g. https://bibs-trending-labels.onrender.com
      - key: BESTSELLER_APP_URL
        sync: false
      - key: BESTSELLER_CRON_SECRET
        fromService:
          type: web
          name: bibs-trending-labels
          envVarKey: BESTSELLER_CRON_SECRET
