# Render setup for the LIVE app "Bibs Trending Labels" (both live BIBS stores).
# Use it as a Blueprint, or create the two services by hand with the same
# values (see HOW-IT-WORKS.md, section 17).
#
# Environment: only the Shopify variables plus the cron secret. Everything else
# has a live default in the code (app/bestseller/env.server.js):
#   - every installed store is processed and may be updated (no store domain
#     anywhere); each store still needs Settings -> Store updates switched on in
#     the app (off by default)
#   - Flow email events are sent (emails need Flow workflows in the store)
#   - database: SQLite on the disk, /var/data/prod.sqlite (app/database-url.js)
#   - Node version: .node-version
# To override a default, add the variable, e.g. BESTSELLER_APPLY_ENABLED=false
# stops all store changes.
#
# Database: needed (sessions/offline tokens for the nightly run, per-store
# settings, history, undo). It is the Prisma SQLite file on the persistent disk:
# no separate database service. A disk needs a paid instance, and with a disk a
# deploy has a short downtime. Do not deploy around 00:00-01:30 UTC.
services:
  - type: web
    name: bibs-trending-labels
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run setup && npm run start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Must be identical to [access_scopes] scopes in shopify.app.toml.
      - key: SCOPES
        value: read_products,read_reports,write_products
      # Client ID / secret of the "Bibs Trending Labels" app.
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # e.g. https://bibs-trending-labels.onrender.com (no trailing slash);
      # must match application_url in shopify.app.toml.
      - key: SHOPIFY_APP_URL
        sync: false
      # Shared with the cron job. Random, at least 24 characters.
      - key: BESTSELLER_CRON_SECRET
        generateValue: true

  # Calls POST /api/cron/nightly at 00:00 and 01:00 UTC; the app picks the call
  # that is 02:00 Copenhagen (summer and winter time).
  - type: cron
    name: bibs-trending-labels-nightly
    runtime: node
    plan: starter
    region: frankfurt
    schedule: "0 0,1 * * *"
    buildCommand: "true"
    startCommand: node scripts/trigger-nightly.mjs
    envVars:
      # Same value as on the web service.
      - key: SHOPIFY_APP_URL
        sync: false
      - key: BESTSELLER_CRON_SECRET
        fromService:
          type: web
          name: bibs-trending-labels
          envVarKey: BESTSELLER_CRON_SECRET
